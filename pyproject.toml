[project]
name = "ha-ecoflow-smart-charge"
version = "1.0.5"
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests run offline: no IP sockets, also when pytest is started by hand.
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
