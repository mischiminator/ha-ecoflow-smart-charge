name: Release
'on':
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
        with:
          python-version: '3.14.7'
      - name: Check tag, versions and changelog
        run: python tools/release.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Package integration for manual installs
        run: |
          cd custom_components/ecoflow_smart_charge
          zip -r -X "$GITHUB_WORKSPACE/ecoflow_smart_charge.zip" . -x '*/__pycache__/*' '__pycache__/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ecoflow_smart_charge.zip
          --verify-tag
          --title "EcoFlow Smart Charge $GITHUB_REF_NAME"
          --notes-file release-notes.md
